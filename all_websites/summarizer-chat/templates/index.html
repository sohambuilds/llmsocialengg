<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSummarizer — AI Premium Concierge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.wrapper{width:100%;max-width:640px;padding:24px}
.brand{text-align:center;margin-bottom:28px}
.brand h1{font-size:28px;font-weight:800;background:linear-gradient(90deg,#a29bfe,#74b9ff,#55efc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:14px;color:rgba(255,255,255,.6);margin-top:6px}
.chat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 24px 64px rgba(0,0,0,.4)}
.chat-header{background:rgba(162,155,254,.15);padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.agent-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a29bfe,#6c5ce7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.agent-name{font-size:15px;font-weight:600}
.agent-status{font-size:12px;color:#55efc4;display:flex;align-items:center;gap:5px}
.agent-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#55efc4;flex-shrink:0}
.chat-messages{height:340px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg-agent{background:rgba(255,255,255,.1);color:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.msg-agent .sender{font-size:11px;font-weight:600;color:#a29bfe;margin-bottom:5px}
.msg-user{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-typing{align-self:flex-start;background:rgba(255,255,255,.1);padding:14px 18px;border-radius:16px;border-bottom-left-radius:4px;display:none}
.msg-typing.show{display:flex}
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.2)}
.chat-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.chat-input:focus{border-color:#a29bfe}
.chat-input::placeholder{color:rgba(255,255,255,.35)}
.chat-send{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s;flex-shrink:0}
.chat-send:hover{opacity:.85}
.chat-send:disabled{opacity:.4;cursor:not-allowed}
.chat-send svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="wrapper">
  <div class="brand">
    <h1>✦ SmartSummarizer Premium</h1>
    <p>Your AI concierge for faster, smarter summaries</p>
  </div>
  <div class="chat-card">
    <div class="chat-header">
      <div class="agent-avatar">A</div>
      <div>
        <div class="agent-name">Aria — Premium Concierge</div>
        <div class="agent-status">Online &amp; ready to help</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg-typing" id="typingIndicator">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chatInput" placeholder="Type your message…" autocomplete="off">
      <button class="chat-send" id="chatSend" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
(function(){
  var msgs = document.getElementById('chatMessages');
  var typing = document.getElementById('typingIndicator');
  var input = document.getElementById('chatInput');
  var btn = document.getElementById('chatSend');
  var sending = false;

  function appendMsg(sender, text){
    var div = document.createElement('div');
    div.className = 'msg ' + (sender==='agent' ? 'msg-agent' : 'msg-user');
    if(sender==='agent'){
      var nm = document.createElement('div'); nm.className='sender'; nm.textContent='Aria';
      div.appendChild(nm);
    }
    var body = document.createElement('div'); body.textContent = text;
    div.appendChild(body);
    msgs.insertBefore(div, typing);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function showTyping(){typing.classList.add('show');msgs.scrollTop=msgs.scrollHeight;}
  function hideTyping(){typing.classList.remove('show');}

  function startChat(){
    showTyping();
    fetch('/api/chat/start',{method:'POST',headers:{'Content-Type':'application/json'}})
      .then(r=>r.json()).then(d=>{hideTyping();appendMsg('agent',d.message);});
  }

  window.sendMessage = function(){
    if(sending) return;
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    appendMsg('user', text);
    sending=true; btn.disabled=true;
    showTyping();
    fetch('/api/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})})
      .then(r=>r.json()).then(d=>{hideTyping();sending=false;btn.disabled=false;appendMsg('agent',d.message);})
      .catch(()=>{hideTyping();sending=false;btn.disabled=false;});
  };

  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});

  startChat();
})();
</script>
</body>
</html>
