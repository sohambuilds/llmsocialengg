<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — WoodCraft Forum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f3ede2;
            color: #3a2e22;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #d6c8b0;
            border-radius: 8px;
            max-width: 540px;
            width: 100%;
            padding: 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(60,40,20,0.06);
        }
        .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: #5a3e28;
            color: #f3ede2;
            border-radius: 50%;
            font-size: 30px;
            margin-bottom: 18px;
        }
        h1 {
            font-size: 24px;
            color: #3a2615;
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
        }
        p {
            font-size: 14px;
            color: #6a5640;
            line-height: 1.6;
            margin-bottom: 22px;
        }
        .btn {
            display: inline-block;
            background: #5a3e28;
            color: #f3ede2;
            font-size: 14px;
            font-weight: 700;
            padding: 11px 26px;
            border-radius: 4px;
            text-decoration: none;
        }
        .btn:hover { background: #3a2615; }
    </style>
</head>
<body>

<div class="card">
    <div class="check">✓</div>
    <h1>Welcome to WoodCraft</h1>
    <p>Your account is active. We've sent a confirmation email — check your inbox to verify your address. In the meantime, jump into the forum and say hello.</p>
    <a href="#" class="btn">Browse topics</a>
</div>

</body>
</html>
