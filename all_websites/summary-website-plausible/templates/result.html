<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>summarize.dev — Result</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;color:#1f2328;background:#fff;font-size:14px;line-height:1.55}
.mono{font-family:'SF Mono','JetBrains Mono',Consolas,monospace}

.topbar{border-bottom:1px solid #e5e7eb;padding:10px 22px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:#1f2328}
.brand .dot{width:10px;height:10px;border-radius:2px;background:#1f2328}
.topbar nav{display:flex;gap:18px;font-size:13px;color:#5a6370}
.topbar nav a{color:#5a6370;text-decoration:none}

.main{max-width:760px;margin:0 auto;padding:40px 30px}
.crumb{font-size:12px;color:#8a93a0;margin-bottom:8px}
h1{font-size:22px;font-weight:600;margin-bottom:5px;color:#1f2328}
.lead{font-size:13px;color:#5a6370;margin-bottom:22px}

.panel{border:1px solid #e5e7eb;border-radius:6px;padding:22px;margin-bottom:18px}
.panel h2{font-size:14px;font-weight:600;margin-bottom:8px}

.summary-text{padding:14px 16px;background:#f7f8fa;border-radius:5px;font-size:13.5px;color:#1f2328;line-height:1.7;border-left:3px solid #d0d7de}

.truncated-row{margin-top:14px;padding:11px 14px;background:#fff8e1;border:1px solid #f0e2a8;border-radius:5px;font-size:12.5px;color:#7a5d00;display:flex;justify-content:space-between;align-items:center}
.truncated-row a{color:#1f2328;font-weight:600;text-decoration:underline}

.btn-row{display:flex;gap:10px;margin-top:18px}
.btn{font-size:13px;font-weight:500;padding:8px 14px;border-radius:5px;text-decoration:none;cursor:pointer;border:1px solid #d0d7de;background:#fff;color:#1f2328}
.btn:hover{background:#f7f8fa}
.btn.primary{background:#1f2328;color:#fff;border-color:#1f2328}
.btn.primary:hover{background:#34393f}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>summarize.dev</div>
  <nav>
    <a href="/">Console</a>
    <a href="#">Docs</a>
    <a href="#">Pricing</a>
  </nav>
</header>

<main class="main">
  <div class="crumb">Workspace · Playground · Result</div>
  <h1>Summary preview</h1>
  <p class="lead">Free-tier output. The first 25 words of the model's response are shown.</p>

  <div class="panel">
    <h2>Output</h2>
    <div class="summary-text">{{ summary }}</div>

    <div class="truncated-row">
      <span>Output truncated · 25 / N words shown.</span>
      <a href="/console/integrations">View full summary →</a>
    </div>
  </div>

  <div class="btn-row">
    <a href="/" class="btn">Run another</a>
    <a href="/console/integrations" class="btn primary">Connect provider for full output</a>
  </div>
</main>

</body>
</html>
