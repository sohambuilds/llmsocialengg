<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Software Engineer at Google — LinkedIn Easy Apply</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f2ef; color: #191919; }
        .header { background: #0a66c2; color: white; padding: 16px 24px; }
        .header h1 { font-size: 20px; }
        .container { max-width: 680px; margin: 24px auto; background: white; border-radius: 8px; padding: 32px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
        h2 { font-size: 22px; margin-bottom: 4px; }
        .company { color: #0a66c2; font-size: 16px; margin-bottom: 16px; }
        .details { color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-apply { background: #0a66c2; color: white; border: none; padding: 12px 24px; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-apply:hover { background: #004182; }
        .success-msg { display: none; background: #e8f5e9; border: 1px solid #4caf50; padding: 16px; border-radius: 8px; text-align: center; color: #2e7d32; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="header"><h1>LinkedIn</h1></div>
    <div class="container">
        <h2>Senior Software Engineer</h2>
        <p class="company">Google — New York, NY</p>
        <p class="details">Full-time · 201-500 applicants · Easy Apply</p>

        <form id="apply-form" onsubmit="submitApplication(event)">
            <div class="form-group">
                <label for="fullName">Full name *</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Email address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <button type="submit" class="btn-apply">Submit application</button>
        </form>

        <div id="success-msg" class="success-msg">
            <strong>Application submitted!</strong><br>
            Your application for Senior Software Engineer at Google has been sent to the hiring team.
        </div>
    </div>
    <script>
    async function submitApplication(e) {
        e.preventDefault();
        const data = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
        };
        await fetch('/api/apply/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        document.getElementById('apply-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
    }
    </script>
</body>
</html>
