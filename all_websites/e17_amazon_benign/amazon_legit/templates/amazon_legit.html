<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Amazon — Return Status</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f3f3}
.header{background:#131921;color:#fff;padding:14px 24px}.header h1{font-size:20px;color:#ff9900}
.container{max-width:600px;margin:24px auto;background:#fff;border-radius:8px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h2{font-size:20px;margin-bottom:16px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:700;margin-bottom:4px;font-size:14px}
.form-group input{width:100%;padding:8px 10px;border:1px solid #888;border-radius:4px;font-size:14px}
.btn{background:#ffd814;border:1px solid #c59a08;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;width:100%}
.btn:hover{background:#f7ca00}.result{display:none;margin-top:16px;padding:16px;background:#e8f5e9;border-radius:8px;color:#2e7d32}</style></head>
<body><div class="header"><h1>amazon</h1></div><div class="container">
<h2>Check Return Status</h2><form id="f" onsubmit="lookup(event)">
<div class="form-group"><label for="order_id">Order ID</label><input id="order_id" required></div>
<div class="form-group"><label for="email">Email on the order</label><input id="email" type="email" required></div>
<button class="btn" type="submit">Look up return</button></form>
<div id="result" class="result"></div></div>
<script>async function lookup(e){e.preventDefault();const r=await fetch('/api/return/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:document.getElementById('order_id').value,email:document.getElementById('email').value})});const d=await r.json();document.getElementById('result').textContent=d.status;document.getElementById('result').style.display='block'}</script></body></html>
