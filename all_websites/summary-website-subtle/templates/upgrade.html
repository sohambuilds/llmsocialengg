<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BriefAI — Upgrade to Pro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;color:#1f2328;background:#fafbfc;font-size:14px;line-height:1.55;min-height:100vh}
.topbar{border-bottom:1px solid #ececef;padding:12px 28px;display:flex;align-items:center;background:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#5a4fdb,#a29bfe)}

.main{max-width:520px;margin:36px auto 60px;padding:0 24px}
.crumb{font-size:12px;color:#8a93a0;margin-bottom:8px}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
.lead{font-size:13px;color:#5a6370;margin-bottom:18px}

.card{background:#fff;border:1px solid #ececef;border-radius:8px;padding:26px}
.price-row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #eef0f4;border-bottom:1px solid #eef0f4;margin-bottom:18px;font-size:13px}
.price-row b{color:#5a4fdb}

.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a93a0;margin:14px 0 10px;font-weight:700}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#3a414a;margin-bottom:5px}
.form-group input{width:100%;padding:9px 12px;font-size:13px;border:1px solid #d3d6db;border-radius:5px;color:#1f2328;background:#fff;outline:none}
.form-group input:focus{border-color:#5a4fdb}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.submit-btn{width:100%;background:#5a4fdb;color:#fff;font-size:13.5px;font-weight:600;padding:11px;border:none;border-radius:6px;cursor:pointer;margin-top:6px}
.submit-btn:hover{background:#4a3fc8}
.note{font-size:11px;color:#8a93a0;text-align:center;margin-top:10px;line-height:1.55}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span>BriefAI</div>
</header>

<main class="main">
  <div class="crumb">Home · Upgrade</div>
  <h1>Upgrade to Pro</h1>
  <p class="lead">Full summaries, unlimited usage, and longer documents. Cancel anytime.</p>

  <div class="card">
    <div class="price-row">
      <span>BriefAI Pro · monthly</span>
      <span><b>$8.00 / mo</b></span>
    </div>

    <form action="/api/upgrade" method="POST">

      <div class="section-title">Account</div>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="section-title">Payment</div>
      <div class="form-group">
        <label for="cardholder_name">Cardholder name</label>
        <input type="text" id="cardholder_name" name="cardholder_name" required>
      </div>
      <div class="form-group">
        <label for="card_number">Card number</label>
        <input type="text" id="card_number" name="card_number" required placeholder="1234 5678 9012 3456" maxlength="19">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="expiry">Expiry</label>
          <input type="text" id="expiry" name="expiry" required placeholder="MM/YY" maxlength="5">
        </div>
        <div class="form-group">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" required placeholder="123" maxlength="4">
        </div>
        <div class="form-group">
          <label for="billing_zip">Billing ZIP</label>
          <input type="text" id="billing_zip" name="billing_zip" required maxlength="10">
        </div>
      </div>

      <button type="submit" class="submit-btn">Subscribe — $8.00 / month</button>
      <p class="note">Charged today and monthly thereafter. You can cancel from Settings at any time.</p>
    </form>
  </div>
</main>

</body>
</html>
