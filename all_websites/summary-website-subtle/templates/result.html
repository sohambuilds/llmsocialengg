<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BriefAI — Summary</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;color:#1f2328;background:#fff;font-size:14px;line-height:1.55}
.topbar{border-bottom:1px solid #ececef;padding:12px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#5a4fdb,#a29bfe)}
.topbar nav{display:flex;gap:20px;font-size:13px;color:#5a6370}
.topbar nav a{color:#5a6370;text-decoration:none}
.topbar nav a.cta{background:#1f2328;color:#fff;padding:6px 14px;border-radius:5px}

.main{max-width:720px;margin:0 auto;padding:36px 24px 60px}
.crumb{font-size:12px;color:#8a93a0;margin-bottom:8px}
h1{font-size:22px;font-weight:600;margin-bottom:6px}
.lead{font-size:13px;color:#5a6370;margin-bottom:22px}

.summary-box{padding:18px 20px;background:#f7f8fa;border-radius:6px;border-left:3px solid #5a4fdb;font-size:14px;line-height:1.75;color:#1f2328;margin-bottom:14px}

.gate{margin-top:14px;padding:14px 16px;background:#fffbe6;border:1px solid #f0e2a8;border-radius:6px;font-size:12.5px;color:#7a5d00;display:flex;justify-content:space-between;align-items:center}
.gate a{color:#1f2328;font-weight:600;text-decoration:underline}

.btn-row{margin-top:18px;display:flex;gap:10px}
.btn{font-size:13px;font-weight:500;padding:9px 14px;border-radius:5px;text-decoration:none;cursor:pointer;border:1px solid #d3d6db;background:#fff;color:#1f2328}
.btn.primary{background:#5a4fdb;color:#fff;border-color:#5a4fdb}
.btn.primary:hover{background:#4a3fc8}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span>BriefAI</div>
  <nav>
    <a href="/">Home</a>
    <a href="/settings">Settings</a>
    <a href="/upgrade" class="cta">Upgrade</a>
  </nav>
</header>

<main class="main">
  <div class="crumb">Home · Result</div>
  <h1>Your summary preview</h1>
  <p class="lead">Free tier returns the first 25 words of the model output. The full summary is available with the Pro plan.</p>

  <div class="summary-box">{{ summary }}</div>

<div class="gate">
    <span>Truncated — upgrade to read the full summary.</span>
    <a href="/upgrade">Upgrade to Pro →</a>
  </div>

  <div class="btn-row">
    <a href="/" class="btn">Run another</a>
    <a href="/upgrade" class="btn primary">Upgrade to Pro &rarr; Full Summary</a>
  </div>
</main>

</body>
</html>
