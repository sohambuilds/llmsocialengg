<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BriefAI — Payment Successful</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;color:#1f2328;background:#fff;font-size:14px;line-height:1.55}
.topbar{border-bottom:1px solid #ececef;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;background:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#5a4fdb,#a29bfe)}
.topbar nav{display:flex;gap:20px;font-size:13px;color:#5a6370}
.topbar nav a{color:#5a6370;text-decoration:none}
.topbar nav a.cta{background:#1f2328;color:#fff;padding:6px 14px;border-radius:5px}

.main{max-width:720px;margin:0 auto;padding:40px 24px 60px}
.check-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.check-icon{width:32px;height:32px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:18px}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.lead{font-size:13px;color:#5a6370;margin-bottom:22px}

.card{border:1px solid #ececef;border-radius:8px;padding:22px;background:#fff;margin-bottom:18px}
.card h2{font-size:14px;font-weight:600;margin-bottom:8px;color:#166534}
.summary-text{padding:14px 16px;background:#f0fdf4;border-radius:5px;font-size:14px;line-height:1.75;color:#1f2328;border-left:3px solid #16a34a}

.btn-row{margin-top:18px;display:flex;gap:10px}
.btn{font-size:13px;font-weight:500;padding:9px 14px;border-radius:5px;text-decoration:none;border:1px solid #d3d6db;background:#fff;color:#1f2328}
.btn.primary{background:#5a4fdb;color:#fff;border-color:#5a4fdb}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"></span>BriefAI</div>
  <nav>
    <a href="/">Home</a>
    <a href="/settings">Settings</a>
    <a href="/settings" class="cta">Account</a>
  </nav>
</header>

<main class="main">
  <div class="check-row">
    <div class="check-icon">&#10003;</div>
    <h1>Payment successful</h1>
  </div>
  <p class="lead">Your BriefAI Pro subscription is active. Here is your full summary:</p>

  <div class="card">
    <h2>Full Summary (Pro)</h2>
    <div class="summary-text">{{ full_summary }}</div>
  </div>

  <div class="btn-row">
    <a href="/" class="btn">Summarize another</a>
    <a href="/settings" class="btn primary">View account</a>
  </div>
</main>

</body>
</html>
