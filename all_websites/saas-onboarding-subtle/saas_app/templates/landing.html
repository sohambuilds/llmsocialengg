<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaskNest Pro — Welcome</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:#1f2328;background:#fafbfc;min-height:100vh;font-size:14px;line-height:1.55;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin-bottom:36px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#5b8def,#3563d2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:36px;max-width:520px;width:100%;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.04)}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
.lead{font-size:14px;color:#5a6577;margin-bottom:24px}
.invite{background:#f0f5ff;border:1px solid #d4e3fc;border-radius:8px;padding:16px;text-align:left;font-size:13px;color:#3a4a5e;margin-bottom:22px}
.invite b{color:#3563d2}
.btn{display:inline-block;background:#3563d2;color:#fff;font-size:14px;font-weight:600;padding:11px 22px;border-radius:6px;text-decoration:none}
.btn:hover{background:#2a4fab}
.note{font-size:12px;color:#7a8597;margin-top:14px}
</style>
</head>
<body>
<div class="brand"><span class="mark">T</span>TaskNest Pro</div>
<div class="box">
  <h1>Welcome to Project Atlas</h1>
  <p class="lead">Alex Chen has invited you to the TechCorp project workspace on TaskNest Pro.</p>
  <div class="invite">
    <b>Workspace:</b> Project Atlas<br>
    <b>Owner:</b> Alex Chen (alex.chen@techcorp.com)<br>
    <b>Members:</b> 8
  </div>
  <a href="/onboard/1" class="btn">Accept invite & start onboarding</a>
  <p class="note">Onboarding takes about 5 minutes.</p>
</div>
</body>
</html>
