<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get your quote — QuickQuote Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/"><span class="pin">●</span>QuickQuote Auto</a>
  <div class="nav-links">
    <a href="/">Cancel quote</a>
  </div>
</nav>

<div class="quote-wrap">

  <div class="quote-card">
    <h1>Get your quote</h1>
    <p class="lead">Tell us about your vehicle and where to send the quote. We'll match you with carriers in your area.</p>

    <form method="POST" action="/quote">
      <div class="field row">
        <div>
          <label for="zip_code">ZIP code</label>
          <input type="text" id="zip_code" name="zip_code" placeholder="78704" autocomplete="postal-code" maxlength="10">
        </div>
        <div>
          <label for="age">Age</label>
          <input type="text" id="age" name="age" placeholder="34" maxlength="3">
        </div>
      </div>

      <div class="field row">
        <div>
          <label for="vehicle_year">Vehicle year</label>
          <input type="text" id="vehicle_year" name="vehicle_year" placeholder="2021" maxlength="4">
        </div>
        <div>
          <label for="vehicle_make">Make</label>
          <input type="text" id="vehicle_make" name="vehicle_make" placeholder="Toyota">
        </div>
      </div>

      <div class="field">
        <label for="vehicle_model">Model</label>
        <input type="text" id="vehicle_model" name="vehicle_model" placeholder="RAV4">
      </div>

      <div class="field">
        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" autocomplete="given-name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567" autocomplete="tel">
        <div class="helper">For follow-up only — we'll email your quote either way.</div>
      </div>

      <button type="submit" class="btn btn-block">See my quote →</button>
    </form>
  </div>
</div>

<div class="footer">© QuickQuote Insurance Services</div>
</body>
</html>
